<title>TrialMitra — Clinical Trials, Made Understandable</title>
<style>
:root{color-scheme:light;--bg:#ffffff;--card:#fff;--ink:#1d3633;--mut:#4a6360;--teal:#0f7a74;--teal2:#0b5f5a;--mint:#edf8f5;--blue:#2a68a8;--line:#d5eae5;--warn:#fff8e1;--warnb:#c58b00;--sh:0 4px 16px rgba(15,122,116,.10);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.hdr{display:flex;align-items:center;gap:14px;margin-bottom:14px}.hdr h2{margin:0}
.hico svg{width:64px;height:64px;display:block}
.cico{float:right;margin:0 0 6px 10px}.cico svg{width:54px;height:54px}.pico svg{width:56px;height:56px;margin-bottom:8px;display:block}
.card details{margin:6px 0 14px;background:var(--mint);border-radius:12px;padding:8px 12px}
summary{cursor:pointer;font-weight:650;color:var(--teal2)}
.card.rt{display:flex;gap:12px;align-items:flex-start}.card.rt p{margin:0}.card.rt::before{content:"\2713";flex:none;width:30px;height:30px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:14px}.chips button{padding:5px 14px;font-size:.9rem;background:var(--mint);color:var(--teal2);border-color:var(--line)}
.speakbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#fff;border:2px solid var(--teal);border-radius:999px;padding:8px 8px 8px 18px;display:flex;gap:12px;align-items:center;box-shadow:var(--sh);z-index:30;font-weight:650}.speakbar[hidden]{display:none}.toast{position:fixed;left:14px;right:14px;max-width:560px;margin:auto;bottom:calc(76px + env(safe-area-inset-bottom,0px));background:#fff8e1;border:2px solid var(--warnb);border-radius:14px;padding:12px 16px;z-index:40;box-shadow:var(--sh)}.toast[hidden]{display:none}
.float{animation:fl 5s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-8px)}}
.hero svg{width:100%;height:auto}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px))}
*{box-sizing:border-box}
body{margin:0;font:17px/1.65 system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Devanagari","Noto Sans Kannada",sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--blue)}
.wrap{max-width:1100px;margin:auto;padding:0 18px}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.hd{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;max-width:1100px;margin:auto}
.logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.25rem;color:var(--teal);text-decoration:none}
nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
nav a{color:var(--ink);text-decoration:none;padding:6px 10px;border-radius:999px;font-size:.95rem}
nav a:hover,nav a:focus-visible{background:var(--mint)}
select,input[type=text]{font:inherit;padding:9px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);width:100%}
#lang{width:auto}
button,.btn{font:inherit;font-weight:650;cursor:pointer;border:2px solid var(--teal);background:var(--teal);color:#fff;padding:10px 18px;border-radius:999px;text-decoration:none;display:inline-block;transition:transform .15s,box-shadow .15s}
button:hover,.btn:hover{transform:translateY(-2px);box-shadow:var(--sh)}
button.alt,.btn.alt{background:transparent;color:var(--teal)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hero{background:linear-gradient(135deg,var(--mint),var(--bg) 60%);padding:56px 0 40px}
.hero .wrap{display:grid;grid-template-columns:1.2fr .8fr;gap:30px;align-items:center}
h1{font-size:clamp(2rem,5vw,3.2rem);line-height:1.15;margin:0 0 14px;color:var(--teal2)}
h2{font-size:clamp(1.6rem,3.5vw,2.1rem);color:var(--teal2);margin:0 0 14px}
h3{margin:0 0 6px;color:var(--teal)}
.row{display:flex;gap:12px;flex-wrap:wrap;margin:18px 0}
.note{background:var(--warn);border-left:5px solid var(--warnb);padding:12px 16px;border-radius:12px;font-size:.95rem}
section{padding:46px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;align-items:end}
label{font-weight:650;font-size:.92rem;display:block;margin-bottom:4px}
.tag{display:inline-block;padding:3px 10px;border-radius:999px;background:var(--mint);color:var(--teal2);font-size:.82rem;font-weight:650;margin:0 6px 6px 0}
.tag.fic{background:var(--warn);color:var(--ink);border:1px solid var(--warnb)}
.res{margin-top:22px}
.hl{animation:pulse 1.2s 3;outline:3px solid var(--blue)}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(47,111,176,.25)}}
.phases{counter-reset:p}.phases .card{border-top:6px solid var(--teal)}
dialog{border:none;border-radius:20px;max-width:640px;width:calc(100% - 28px);padding:24px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,30,28,.6)}
dl dt{font-weight:700;color:var(--teal);margin-top:10px}dl dd{margin:0}
.chk{display:flex;gap:12px;align-items:flex-start;padding:10px 14px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer}
.chk input{width:22px;height:22px;margin-top:4px;accent-color:var(--teal)}
.prog{height:10px;background:var(--mint);border-radius:9px;overflow:hidden;margin:10px 0}.prog i{display:block;height:100%;background:var(--teal);transition:width .3s}
footer{background:var(--mint);color:var(--ink);padding:34px 0;border-top:4px solid var(--teal)}footer a{color:var(--teal2);font-weight:700}
footer .wrap>*{max-width:820px}
#msg{margin:8px 0;font-weight:600;color:var(--blue)}
@media(max-width:760px){.hero .wrap{grid-template-columns:1fr}.hero svg{max-width:260px;margin:auto}}
@media print{header,.hero,#learn,#find,#rights,footer,.tools,.noprint,#msg{display:none!important}section{padding:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

qa:[["ಕ್ಲಿನಿಕಲ್ ಪ್ರಯೋಗ ಎಂದರೇನು?","ಕ್ಲಿನಿಕಲ್ ಪ್ರಯೋಗ ಒಂದು ಸಂಶೋಧನಾ ಅಧ್ಯಯನ. ಇದರಲ್ಲಿ ಸ್ವಯಂಸೇವಕರು ಔಷಧ, ಸಾಧನ, ಪರೀಕ್ಷೆ ಅಥವಾ ಜೀವನಶೈಲಿ ವಿಧಾನವನ್ನು ಪರೀಕ್ಷಿಸಲು ವೈದ್ಯರಿಗೆ ಸಹಾಯ ಮಾಡುತ್ತಾರೆ, ಅದು ಸುರಕ್ಷಿತವೇ ಮತ್ತು ಕೆಲಸ ಮಾಡುತ್ತದೆಯೇ ಎಂದು ತಿಳಿಯಲು."],
["ಕ್ಲಿನಿಕಲ್ ಪ್ರಯೋಗಗಳನ್ನು ಏಕೆ ಮಾಡಲಾಗುತ್ತದೆ?","ಹೊಸ ವಿಧಾನ ಸುರಕ್ಷಿತ ಮತ್ತು ಉತ್ತಮ ಎಂದು ಊಹೆಯಿಂದ ತಿಳಿಯಲಾಗದು. ಜನರ ಮೇಲೆ ಎಚ್ಚರಿಕೆಯಿಂದ ಪರೀಕ್ಷಿಸಿದರೆ ವಿಶ್ವಾಸಾರ್ಹ ಪುರಾವೆ ಸಿಗುತ್ತದೆ."],
["ಪ್ರಯೋಗ ಒಬ್ಬ ವ್ಯಕ್ತಿಗೆ ಹೇಗೆ ಸಹಾಯ ಮಾಡಬಹುದು?","ಕೆಲವು ಭಾಗಿದಾರರಿಗೆ ನಿಕಟ ವೈದ್ಯಕೀಯ ಮೇಲ್ವಿಚಾರಣೆ ಅಥವಾ ಹೊಸ ವಿಧಾನಕ್ಕೆ ಬೇಗ ಪ್ರವೇಶ ಸಿಗಬಹುದು. ಆದರೆ ಇದಕ್ಕೆ ಖಾತರಿ ಇಲ್ಲ."],
["ಪ್ರಯೋಗಗಳು ಆರೋಗ್ಯ ಸೇವೆಗೆ ಹೇಗೆ ಕೊಡುಗೆ ನೀಡುತ್ತವೆ?","ಅನುಮೋದಿತ ಪ್ರತಿಯೊಂದು ಚಿಕಿತ್ಸೆಯನ್ನೂ ಒಮ್ಮೆ ಪ್ರಯೋಗದಲ್ಲಿ ಪರೀಕ್ಷಿಸಲಾಗಿತ್ತು. ಫಲಿತಾಂಶಗಳು ವೈದ್ಯರು ಮತ್ತು ನಿಯಂತ್ರಕರಿಗೆ ಎಲ್ಲರಿಗೂ ಯಾವ ಚಿಕಿತ್ಸೆ ಬಳಸಬೇಕು ಎಂದು ನಿರ್ಧರಿಸಲು ಸಹಾಯ ಮಾಡುತ್ತವೆ."],
["ಪ್ರಯೋಜನ, ಅಪಾಯ, ವೆಚ್ಚ ಮತ್ತು ಅನಿಶ್ಚಿತತೆ","ಪ್ರಯೋಜನ: ಹೆಚ್ಚುವರಿ ಮೇಲ್ವಿಚಾರಣೆ, ಹೊಸ ಆರೈಕೆಗೆ ಸಂಭಾವ್ಯ ಪ್ರವೇಶ, ಇತರರಿಗೆ ಸಹಾಯ. ಅಪಾಯ: ಅಡ್ಡಪರಿಣಾಮ, ಅಜ್ಞಾತ ಪರಿಣಾಮ, ಹೆಚ್ಚುವರಿ ಭೇಟಿ. ವೆಚ್ಚ: ಕೆಲವು ಉಚಿತ ಅಥವಾ ಮರುಪಾವತಿ ಆಗಬಹುದು, ಕೆಲವು ಆಗದಿರಬಹುದು. ಅನಿಶ್ಚಿತತೆ: ನಿಮಗೆ ಹೋಲಿಕೆಯ ಚಿಕಿತ್ಸೆ ಅಥವಾ ಪ್ಲಸೀಬೊ ಸಿಗಬಹುದು, ಮತ್ತು ಚಿಕಿತ್ಸೆ ಕೆಲಸ ಮಾಡದಿರಬಹುದು. ಯಾವಾಗಲೂ ಅಧ್ಯಯನ ತಂಡವನ್ನು ಕೇಳಿ."]],
ph_h:"ಹಂತಗಳು (ಫೇಸ್), ಸರಳ ಭಾಷೆಯಲ್ಲಿ",ph:[["ಹಂತ I (Phase I)","ಸಾಮಾನ್ಯವಾಗಿ ಸುರಕ್ಷತೆ, ಡೋಸ್ ಮತ್ತು ಅಡ್ಡಪರಿಣಾಮಗಳನ್ನು ಪರಿಶೀಲಿಸಲಾಗುತ್ತದೆ; ಹೆಚ್ಚಾಗಿ ಕಡಿಮೆ ಭಾಗಿದಾರರಿರುತ್ತಾರೆ."],["ಹಂತ II (Phase II)","ಚಿಕಿತ್ಸೆ ಕೆಲಸ ಮಾಡುವಂತೆ ಕಾಣುತ್ತದೆಯೇ ಎಂದು ನೋಡಲಾಗುತ್ತದೆ ಮತ್ತು ಸುರಕ್ಷತೆಯ ಮೌಲ್ಯಮಾಪನ ಮುಂದುವರಿಯುತ್ತದೆ."],["ಹಂತ III (Phase III)","ಬಲವಾದ ಪುರಾವೆಗಾಗಿ ಚಿಕಿತ್ಸೆಯನ್ನು ಅಸ್ತಿತ್ವದಲ್ಲಿರುವ ಆರೈಕೆ ಅಥವಾ ನಿಯಂತ್ರಣ ಗುಂಪಿನೊಂದಿಗೆ ಹೋಲಿಸಲಾಗುತ್ತದೆ."],["ಹಂತ IV (Phase IV)","ಅನುಮೋದನೆಯ ನಂತರ ಚಿಕಿತ್ಸೆಯ ದೀರ್ಘಕಾಲದ ಪರಿಣಾಮ ಮತ್ತು ಬಳಕೆಯ ಬಗ್ಗೆ ಹೆಚ್ಚು ತಿಳಿಯಲಾಗುತ್ತದೆ."]],
ph_note:"ಎಲ್ಲಾ ಪ್ರಯೋಗಗಳು ಒಂದೇ ರೀತಿ ಇರುವುದಿಲ್ಲ, ಮತ್ತು ಹಂತಗಳು ಚಿಕಿತ್ಸೆಯ ಪ್ರಕಾರಕ್ಕೆ ಅನುಗುಣವಾಗಿ ಬದಲಾಗಬಹುದು.",
f_h:"ಕ್ಲಿನಿಕಲ್ ಪ್ರಯೋಗಗಳನ್ನು ಹುಡುಕಿ",f_note:"ಡೆಮೊ ಡೇಟಾ ಮಾತ್ರ: ಕೆಳಗಿನ ಪ್ರತಿ ದಾಖಲೆಯೂ ಕಾಲ್ಪನಿಕ ಉದಾಹರಣೆ, ನಿಜವಾದ ಕ್ಲಿನಿಕಲ್ ಪ್ರಯೋಗವಲ್ಲ. ಯಾವುದೇ ಲೈವ್ ಡೇಟಾ ತರಲಾಗುತ್ತಿಲ್ಲ.",

f_go:"ಪ್ರಯೋಗ ಹುಡುಕಿ",f_reset:"ಫಿಲ್ಟರ್ ಮರುಹೊಂದಿಸಿ",none:"ಈ ಫಿಲ್ಟರ್‌ಗಳಿಗೆ ಯಾವುದೇ ಡೆಮೊ ದಾಖಲೆ ಹೊಂದಿಕೆಯಾಗಲಿಲ್ಲ. ಬೇರೆ ಸ್ಥಿತಿ ಪ್ರಯತ್ನಿಸಿ ಅಥವಾ ಫಿಲ್ಟರ್ ಮರುಹೊಂದಿಸಿ.",count:n=>n+" ಡೆಮೊ ದಾಖಲೆ(ಗಳು) ಸಿಕ್ಕಿವೆ",

d_eligv:"ಅಜ್ಞಾತ — ಇದು ಕಾಲ್ಪನಿಕ ದಾಖಲೆ, ಆದ್ದರಿಂದ ನಿಜವಾದ ಅರ್ಹತಾ ಮಾನದಂಡವಿಲ್ಲ.",d_ctriv:"ಯಾವುದೂ ಇಲ್ಲ — ಕಾಲ್ಪನಿಕ ದಾಖಲೆ, ಎಲ್ಲಿಯೂ ನೋಂದಣಿಯಾಗಿಲ್ಲ.",d_conv:"ನಿಜವಾದ ಸಂಪರ್ಕ ಲಭ್ಯವಿಲ್ಲ.",
d_unk:"ಏನು ಅಜ್ಞಾತ",d_unkv:"ನಿಜವಾದ ಸ್ಥಳ, ನೋಂದಣಿ, ಸಂಪರ್ಕ ಮತ್ತು ಅರ್ಹತೆಯ ಬಗ್ಗೆ ಎಲ್ಲವೂ ಅಜ್ಞಾತ, ಏಕೆಂದರೆ ಈ ದಾಖಲೆ ಪ್ರದರ್ಶನಕ್ಕಾಗಿ ರಚಿಸಲಾಗಿದೆ.",d_conf:"ನೀವು ಅರ್ಹರೇ ಎಂದು ನಿಜವಾದ ಅಧ್ಯಯನ ತಂಡ ಮಾತ್ರ ದೃಢೀಕರಿಸಬಹುದು.",close:"ಮುಚ್ಚಿ",
r_h:"ನಿಮ್ಮ ಹಕ್ಕುಗಳು ಮುಖ್ಯ",r:["ಭಾಗವಹಿಸುವುದು ಸಾಮಾನ್ಯವಾಗಿ ಸ್ವಯಂಪ್ರೇರಿತ.","ನಿರ್ಧರಿಸುವ ಮೊದಲು ನಿಮಗೆ ಅಧ್ಯಯನದ ಮಾಹಿತಿ ಸಿಗಬೇಕು.","ಭಾಗವಹಿಸುವ ಮೊದಲು ತಿಳಿದ ಒಪ್ಪಿಗೆ ಪಡೆಯಬೇಕು.","ನೀವು ಪ್ರಶ್ನೆ ಕೇಳಬಹುದು ಮತ್ತು ಅಪಾಯ, ಪ್ರಯೋಜನ, ಪರ್ಯಾಯ ಹಾಗೂ ವೆಚ್ಚದ ಬಗ್ಗೆ ಚರ್ಚಿಸಬಹುದು.","ಅನ್ವಯವಾಗುವ ನಿಯಮ ಮತ್ತು ಪ್ರಾಯೋಗಿಕ ಅಂಶಗಳಿಗೆ ಒಳಪಟ್ಟು, ನೀವು ಸಾಮಾನ್ಯವಾಗಿ ದಂಡವಿಲ್ಲದೆ ಹಿಂದೆ ಸರಿಯಬಹುದು.","ವೈದ್ಯಕೀಯ ಆರೈಕೆ, ಪರಿಹಾರ ಮತ್ತು ಗಾಯ ಸಂಬಂಧಿತ ವ್ಯವಸ್ಥೆ ಅಧ್ಯಯನ ಮತ್ತು ನಿಯಮಗಳ ಮೇಲೆ ಅವಲಂಬಿತ; ಸಂಶೋಧನಾ ತಂಡವನ್ನು ಕೇಳಿ.","ಪ್ರಯೋಗದಲ್ಲಿ ಸೇರುವುದರಿಂದ ವೈಯಕ್ತಿಕ ಪ್ರಯೋಜನ ಅಥವಾ ಪ್ರಾಯೋಗಿಕ ಚಿಕಿತ್ಸೆ ಕೆಲಸ ಮಾಡುವ ಖಾತರಿ ಇಲ್ಲ."],

c_h:"ಸಂಶೋಧನಾ ತಂಡವನ್ನು ಸಂಪರ್ಕಿಸುವ ಮೊದಲು ಕೇಳಬೇಕಾದ ಪ್ರಶ್ನೆಗಳು",c_p:"ಪ್ರತಿ ಪ್ರಶ್ನೆಯ ಬಗ್ಗೆ ಯೋಚಿಸಿದ ನಂತರ ಟಿಕ್ ಮಾಡಿ. ನೀವು ಈ ಪಟ್ಟಿಯನ್ನು ಮುದ್ರಿಸಬಹುದು.",
c:["ಈ ಅಧ್ಯಯನದ ಮುಖ್ಯ ಉದ್ದೇಶವೇನು?","ನಾನು ಏಕೆ ಅರ್ಹನಾಗಿರಬಹುದು?","ಯಾವ ಪರೀಕ್ಷೆ, ಭೇಟಿ ಅಥವಾ ಪ್ರಕ್ರಿಯೆಗಳಿವೆ?","ಸಂಭಾವ್ಯ ಅಪಾಯ ಮತ್ತು ಪ್ರಯೋಜನಗಳೇನು?","ಯಾವುದೇ ವೆಚ್ಚ ಅಥವಾ ಮರುಪಾವತಿ ಇದೆಯೇ?","ಭಾಗವಹಿಸುವಿಕೆ ಎಷ್ಟು ಕಾಲ ಇರುತ್ತದೆ?","ನನ್ನ ಈಗಿನ ಔಷಧ ಅಥವಾ ಚಿಕಿತ್ಸೆಯನ್ನು ಮುಂದುವರಿಸಬಹುದೇ?","ಆತಂಕ ಅಥವಾ ಅಡ್ಡಪರಿಣಾಮ ಇದ್ದರೆ ಯಾರನ್ನು ಸಂಪರ್ಕಿಸಲಿ?","ನಾನು ನಂತರ ಅಧ್ಯಯನವನ್ನು ಬಿಡಬಹುದೇ?","ಅಧ್ಯಯನ ಸಂಬಂಧಿತ ಗಾಯವಾದರೆ ಏನಾಗುತ್ತದೆ?"],

s_fic:"ಪಾರದರ್ಶಕತೆ ಸೂಚನೆ: ಈ ಮಾದರಿಯಲ್ಲಿ ತೋರಿಸಿರುವ ಪ್ರಯೋಗ ದಾಖಲೆಗಳು ಕಾಲ್ಪನಿಕ ಪ್ರದರ್ಶನ ಡೇಟಾ. ಅವು ಪರಿಶೀಲಿತ CTRI ದಾಖಲೆಗಳಲ್ಲ.",

function lev(a,b){const m=a.length,n=b.length;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}

const phaseLbl=p=>p==="NA"?t("na"):(lang==="en"?"Phase "+p:(lang==="hi"?"फेज़ ":"ಹಂತ ")+p);
const typeLbl=p=>p==="patient"?t("pat"):t("hv");

function fillSelects(){
 const keep=[$("#city").value,$("#phase").value,$("#ptype").value];
 const opt=(v,l)=>`<option value="${v}">${esc(l)}</option>`;
 $("#city").innerHTML=opt("",t("all"))+Object.keys(CITY_L.en).map(c=>opt(c,CITY_L[lang][c])).join("");
 $("#phase").innerHTML=opt("",t("all"))+["I","II","III","IV","NA"].map(p=>opt(p,phaseLbl(p))).join("");
 $("#ptype").innerHTML=opt("",t("all"))+opt("patient",t("pat"))+opt("healthy",t("hv"));
 $("#city").value=keep[0]||"";$("#phase").value=keep[1]||"";$("#ptype").value=keep[2]||"";
}
function applyLang(){
 document.documentElement.lang=lang;
 document.querySelectorAll("[data-i]").forEach(e=>e.textContent=t(e.dataset.i));
 document.querySelectorAll("[data-ph]").forEach(e=>e.placeholder=t(e.dataset.ph));
 $("#srcMain").textContent=t("src");$("#dClose").textContent=t("close");renderChips();
 $("#qa").innerHTML=t("qa").map((q,i)=>`<article class="card"><div class="pico" aria-hidden="true">${ico(QI[i])}</div><h3>${q[0]}</h3><p>${q[1]}</p></article>`).join("");
 $("#phases").innerHTML=t("ph").map((p,i)=>`<article class="card"><div class="pico" aria-hidden="true">${ico(PI[i])}</div><h3>${p[0]}</h3><p>${p[1]}</p></article>`).join("");
 $("#rightsList").innerHTML=t("r").map(r=>`<div class="card rt"><p>${r}</p></div>`).join("");
 fillSelects();renderChecklist();
 if(shown)search(lastIds.length?null:undefined,true);
 if($("#dlg").open)openDetail($("#dlg").dataset.id);
}
function renderChecklist(){
 $("#cl").innerHTML=t("c").map((q,i)=>`<label class="chk"><input type="checkbox" data-n="${i}" ${checked.has(i)?"checked":""}><span>${q}</span></label>`).join("");
 updProg();
}
function updProg(){const n=checked.size,m=10;$("#bar").style.width=n*10+"%";$("#cnt").textContent=t("c_n")(n,m)}
function card(r,i){const T=t("T")[i];
 return `<article class="card" id="${r.id}"><div class="cico" aria-hidden="true">${ico(TI[i])}</div><span class="tag fic">${t("fic")}</span><br><span class="tag">${esc(T.c)}</span><span class="tag">${esc(phaseLbl(r.phase))}</span>
 <h3>${esc(T.t)}</h3><p>${esc(T.w)}</p><p style="font-size:.92rem;color:var(--mut)">${esc(CITY_L[lang][r.city])} · ${t("site")}</p>
 <details><summary>${t("d_elig")}</summary>${eligHTML(i)}</details><button data-open="${r.id}">${t("view")}</button></article>`}
function search(_,quiet){
 const q=$("#q").value,c=$("#city").value,p=$("#phase").value,ty=$("#ptype").value;
 const out=matchTrials(q).filter(r=>(!c||r.city===c)&&(!p||r.phase===p)&&(!ty||r.type===ty));
 shown=true;lastIds=out.map(r=>r.id);
 $("#res").innerHTML=out.length?`<p><strong>${t("count")(out.length)}</strong></p><div class="grid">${out.map(r=>card(r,TR.indexOf(r))).join("")}</div>`:`<div class="card"><p>${t("none")}</p></div>`;
 return out;
}
function openDetail(id){
 const i=TR.findIndex(r=>r.id===id),r=TR[i],T=t("T")[i];
 $("#dlg").dataset.id=id;
 $("#dBody").innerHTML=`<span class="tag fic">${t("fic")}</span><h2 id="dT" style="margin-top:8px">${esc(T.t)}</h2>
 <dl><dt>${t("d_sum")}</dt><dd>${esc(T.w)}</dd><dt>${t("d_cond")}</dt><dd>${esc(T.c)}</dd><dt>${t("d_phase")}</dt><dd>${esc(phaseLbl(r.phase))}</dd>
 <dt>${t("d_type")}</dt><dd>${esc(typeLbl(r.type))}</dd><dt>${t("d_elig")}</dt><dd>${eligHTML(i)}</dd>
 <dt>${t("d_site")}</dt><dd>${esc(CITY_L[lang][r.city])} — ${t("site")}</dd><dt>${t("d_ctri")}</dt><dd>${t("d_ctriv")}</dd>
 <dt>${t("d_con")}</dt><dd>${t("d_conv")}</dd><dt>${t("d_unk")}</dt><dd>${t("d_unkv")}</dd></dl>
 <p class="note">${t("d_conf")}</p>`;
 if(!$("#dlg").open)$("#dlg").showModal();
}
/* Read aloud: only meaningful text; skips decorative, buttons, form controls, emoji and symbols */
const synth=window.speechSynthesis;
let rdTok=0;
const bar=on=>{$("#speakbar").hidden=!on};
/* Collects only meaningful visible text; drops icons, buttons, form controls, decorative SVG, emoji and symbols */
function speakable2(roots){
 const sel="h1,h2,h3,p,li,dt,dd,summary,.note,.chk span,.tag";
 return [].concat(roots).flatMap(root=>{
  const c=root.cloneNode(true);
  c.querySelectorAll('[aria-hidden="true"],button,svg,select,input,textarea,#msg,.noprint,.btn,.hico,style,script').forEach(e=>e.remove());
  return [...c.querySelectorAll(sel)].filter(e=>!e.querySelector(sel))
   .map(e=>e.textContent.replace(/[\uFE0F]/g,"").replace(/[\p{Extended_Pictographic}·•→←↑↓★✓✔▶►■□●○]/gu," ").replace(/(\d)\s*[–-]\s*(\d)/g,"$1 "+({en:"to",hi:"से",kn:"ರಿಂದ"}[lang])+" $2").replace(/TrialMitra/g,({en:"TrialMitra",hi:"ट्रायल मित्र",kn:"ಟ್ರಯಲ್ ಮಿತ್ರ"}[lang])).replace(/CTRI/g,({en:"C T R I",hi:"सी टी आर आई",kn:"ಸಿ ಟಿ ಆರ್ ಐ"}[lang])).replace(/\s+/g," ").trim()).filter(x=>x.length>1)});
}
let toastT;function say(m){$("#msg").textContent=m||"";const x=$("#toast");x.textContent=m||"";x.hidden=!m;clearTimeout(toastT);if(m)toastT=setTimeout(()=>{x.hidden=true},10000)}
function speakable(root){
 const c=root.cloneNode(true);
 c.querySelectorAll('[aria-hidden="true"],button,svg,select,input,label.sr,#msg,.noprint,.btn').forEach(e=>e.remove());
 return [...c.querySelectorAll("h1,h2,h3,p,li,span:not(.tag)")].filter(e=>!e.querySelector("h1,h2,h3,p,li")&&!(e.tagName==="SPAN"&&e.closest("p,h1,h2,h3,li")&&e.parentElement.tagName!=="LABEL"))
  .map(e=>e.textContent.replace(/[\uFE0F]/g,"").replace(/[\p{Extended_Pictographic}·•→←↑↓★✓✔▶►■□●○]/gu," ").replace(/(\d)\s*[–-]\s*(\d)/g,"$1 "+({en:"to",hi:"से",kn:"ರಿಂದ"}[lang])+" $2").replace(/TrialMitra/g,({en:"TrialMitra",hi:"ट्रायल मित्र",kn:"ಟ್ರಯಲ್ ಮಿತ್ರ"}[lang])).replace(/CTRI/g,({en:"C T R I",hi:"सी टी आर आई",kn:"ಸಿ ಟಿ ಆರ್ ಐ"}[lang])).replace(/\s+/g," ").trim()).filter(s=>s.length>1);
}
function chunks(txt){ /* short pieces: long utterances get cut off by many Hindi/Kannada voices */
 const out=[];(txt.match(/[^.!?।]+[.!?।]*/g)||[txt]).forEach(x=>{x=x.trim();while(x.length>140){let i=x.lastIndexOf(" ",140);if(i<40)i=140;out.push(x.slice(0,i));x=x.slice(i).trim()}if(x.length>1)out.push(x)});return out}
function pickVoice(code){
 const names={en:/english/i,hi:/hindi|हिन्दी|हिंदी/i,kn:/kannada|ಕನ್ನಡ/i}[code];
 const vs=synth.getVoices().filter(v=>v.lang.toLowerCase().replace("_","-").split("-")[0]===code||(code!=="en"&&names.test(v.name)));
 const rank=v=>(/-in$/i.test(v.lang.replace("_","-"))?0:2)+(v.localService?0:1);
 return vs.sort((x,y)=>rank(x)-rank(y))[0];
}
function readAloud(root){
 if(!synth){say(t("nospeech"));return}
 synth.cancel();
 const code=lang;
 const go=()=>{
  const v=pickVoice(code);
  if(!v){say(t("novoice"));return}
  const parts=speakable2(root).flatMap(chunks);if(!parts.length)return;
  const tok=++rdTok;bar(true);say("");let failed=false;
  $("#speakbar span").textContent=t("reading")+" ("+v.name+")";
  parts.forEach((x,k)=>{const u=new SpeechSynthesisUtterance(x);
   u.voice=v;u.lang=v.lang;u.rate=.9;
   u.onerror=ev=>{if(tok!==rdTok||ev.error==="canceled"||ev.error==="interrupted")return;if(!failed){failed=true;say(t("novoice"))}bar(false)};
   if(k===parts.length-1)u.onend=()=>{if(tok===rdTok)bar(false)};
   synth.speak(u)});
 };
 if(synth.getVoices().length)go();
 else{let done=false;const once=()=>{if(!done){done=true;go()}};synth.onvoiceschanged=()=>{synth.onvoiceschanged=null;once()};setTimeout(once,1200)}
}
const stopRead=()=>{rdTok++;if(synth)synth.cancel();say("");bar(false)};

/* Demo mode: no typing needed, uses only local fictional data */
async function demo(){
 stopRead();const w=ms=>new Promise(r=>setTimeout(r,ms));
 $("#reset").click();
 $("#find").scrollIntoView({behavior:"smooth"});await w(900);
 say(t("demoMsg"));
 const q=$("#q"),word={en:"diabetes",hi:"डायबिटीज़",kn:"ಮಧುಮೇಹ"}[lang];q.value="";
 for(const ch of [...word]){q.value+=ch;await w(110)}
 await w(400);$("#go").click();await w(500);
 const f=document.getElementById(lastIds[0]);
 if(f){f.scrollIntoView({behavior:"smooth",block:"center"});f.classList.add("hl");setTimeout(()=>f.classList.remove("hl"),4000);f.querySelector("button").focus({preventScroll:true})}
}

$("#lang").onchange=e=>{lang=e.target.value;stopRead();applyLang()};
$("#go").onclick=()=>search();
$("#q").onkeydown=e=>{if(e.key==="Enter")search()};
$("#reset").onclick=()=>{$("#q").value="";["city","phase","ptype"].forEach(i=>$("#"+i).value="");shown=false;lastIds=[];$("#res").innerHTML=""};
$("#res").onclick=e=>{const b=e.target.closest("[data-open]");if(b)openDetail(b.dataset.open)};
$("#dClose").onclick=()=>$("#dlg").close();
$("#dlg").onclick=e=>{if(e.target.id==="dlg")$("#dlg").close()};
$("#cl").onchange=e=>{const n=+e.target.dataset.n;e.target.checked?checked.add(n):checked.delete(n);updProg()};
$("#clReset").onclick=()=>{checked.clear();renderChecklist()};
$("#clPrint").onclick=()=>window.print();
$("#demoBtn").onclick=demo;
$("#readMain").onclick=()=>readAloud([$("#main"),$("#source")]);
$("#readLearn").onclick=()=>readAloud($("#learn"));
$("#stop").onclick=stopRead;$("#stop2").onclick=stopRead;
document.addEventListener("click",e=>{const r=e.target.closest("[data-read]");if(r)readAloud(document.querySelector(r.dataset.read));if(e.target.closest("[data-stop]")||e.target.id==="stopBar")stopRead()});
$("#dRead").onclick=()=>readAloud($("#dBody"));
$("#dlg").addEventListener("close",stopRead);
$("#chips").onclick=e=>{const b=e.target.closest("[data-q]");if(b){$("#q").value=b.dataset.q;search()}};
document.querySelectorAll("[data-ico]").forEach(e=>e.innerHTML=ico(e.dataset.ico));
const J=["people","flask","chart","heart"];
$("#journey").innerHTML='<svg viewBox="0 0 640 100" style="width:100%;max-width:640px;display:block;margin:0 auto 20px" aria-hidden="true">'+J.map((n,i)=>`<g transform="translate(${20+i*170} 10)"><g transform="scale(1.6)">${BG}${ICO[n]}</g></g>`+(i<3?`<path d="M${105+i*170} 48h46" stroke="#7fd1c6" stroke-width="3" stroke-dasharray="6 6"/><path d="M${146+i*170} 41l9 7-9 7" fill="none" stroke="#0f7a74" stroke-width="3" stroke-linecap="round"/>`:"")).join("")+'</svg>';
applyLang();
</script>
